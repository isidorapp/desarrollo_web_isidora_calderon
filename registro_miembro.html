<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Miembros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html">Inicio</a>
        <a href="registro_miembro.html">Registro Miembros</a>
        <a href="registro_actividad.html">Registro Actividades</a>
        <a href="listado_miembros.html">Listado de Miembros</a>
        <a href="metricas.html">Estadísticas</a>
    </nav>
    <header>
        <h1>Registro</h1>
        <nav><a href="index.html">Volver al Inicio</a></nav>
    </header>

    <main>
        <section>
            <form id="formRegistroMiembro" action="#" method="POST">
                <p>Los campos marcados con (*) son obligatorios.</p>
            
                <label for="nombre">Nombre Completo (*):</label>
                <input type="text" id="nombre" name="nombre">
                <span class="error-msg" id="errorNombre"></span>

                <label for="email">Correo Electrónico (*):</label>
                <input type="email" id="email" name="email">
                <span class="error-msg" id="errorEmail"></span>

                <label for="tipoMiembro">Tipo de Miembro (*):</label>
                <select id="tipoMiembro" name="tipoMiembro">
                    <option value="">-- Seleccione una opción --</option>
                    <option value="estudiante">Estudiante de Pre/Postgrado</option>
                    <option value="funcionario">Funcionario(a)</option>
                    <option value="academico">Académico(a)</option>
                </select>
                <span class="error-msg" id="errorTipo"></span>

                <button type="submit" id="btnEnviar">Registrar Miembro</button>
            </form>
        </section>
    </main>
    <script src="validador.js"></script>

    <footer>
        <p>Tarea 1 - CC5002 ❤︎ 2026-1</p>
    </footer>
</body>

</html>
